<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LandarsFood{% endblock %}</title>
  <style>
    :root {
      --canvas: #faf4e8;
      --ink: #1a1a1a;
      --body: #5f5147;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #ead9bf;
      --gold: #d9a441;
      --gold-deep: #a68b5b;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      --success-bg: #f0fdf4;
      --success-ink: #166534;
      --warning-bg: #fffbeb;
      --warning-ink: #92400e;
      --neutral-bg: #f8f3ea;
      --neutral-ink: #5f5147;
      --radius: 1rem;
      --font: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--canvas);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: color-mix(in srgb, var(--gold) 35%, transparent);
      color: var(--ink);
    }

    .page {
      width: 100%;
      max-width: 28rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .brand-name {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.2;
    }

    .brand-rule {
      width: 2.5rem;
      height: 2px;
      margin-top: 0.75rem;
      background: var(--gold);
      border: 0;
      border-radius: 1px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem 1.75rem;
      text-align: center;
    }

    @media (min-width: 480px) {
      .card { padding: 2.25rem 2rem 2rem; }
    }

    .seal {
      width: 3.25rem;
      height: 3.25rem;
      margin: 0 auto 1.25rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .seal svg {
      width: 1.5rem;
      height: 1.5rem;
      display: block;
    }

    .seal--success {
      background: var(--success-bg);
      color: var(--success-ink);
    }

    .seal--confirming {
      margin: 0;
      background: color-mix(in srgb, var(--gold) 18%, #ffffff);
      color: var(--gold-deep);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 28%, transparent);
    }

    .seal--void {
      background: var(--neutral-bg);
      color: var(--neutral-ink);
    }

    .seal--unavailable {
      background: var(--warning-bg);
      color: var(--warning-ink);
    }

    /* Magic UI Ripple — adapted for invoice payment confirming
       https://magicui.design/docs/components/ripple */
    .confirming-loader {
      position: relative;
      width: 9.5rem;
      height: 9.5rem;
      margin: -0.5rem auto 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .confirming-ripple {
      pointer-events: none;
      position: absolute;
      inset: 0;
      user-select: none;
      -webkit-mask-image: radial-gradient(circle at center, #000 42%, transparent 78%);
      mask-image: radial-gradient(circle at center, #000 42%, transparent 78%);
    }

    .confirming-ripple__ring {
      --i: 0;
      --duration: 2s;
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(3rem + (var(--i) * 1.45rem));
      height: calc(3rem + (var(--i) * 1.45rem));
      border-radius: 9999px;
      border: 1px solid color-mix(in srgb, var(--gold) 62%, var(--border));
      background: color-mix(in srgb, var(--gold) 16%, transparent);
      opacity: calc(0.42 - (var(--i) * 0.05));
      transform: translate(-50%, -50%) scale(1);
      animation: magic-ripple var(--duration) ease calc(var(--i) * 0.12s) infinite;
      box-shadow: 0 8px 20px rgba(61, 43, 28, 0.04);
    }

    .confirming-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1.75rem;
      height: 1.75rem;
      margin: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: confirming-spin 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .confirming-spinner circle {
      fill: none;
      stroke: var(--gold-deep);
      stroke-width: 2.5;
      stroke-linecap: round;
      /* Circumference ≈ 2π·10.5 ≈ 66 — short arc just outside the clock rim */
      stroke-dasharray: 20 66;
      stroke-dashoffset: 0;
    }

    @keyframes magic-ripple {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(0.9); }
    }

    @keyframes confirming-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .confirming-ripple__ring,
      .confirming-spinner {
        animation: none;
      }

      .confirming-spinner {
        transform: translate(-50%, -50%);
      }
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.375rem, 4vw, 1.625rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--ink);
      text-wrap: balance;
    }

    .lead {
      margin: 0;
      font-size: 0.9375rem;
      line-height: 1.55;
      color: var(--body);
      text-wrap: pretty;
    }

    .lead + .lead { margin-top: 0.5rem; }

    .amount {
      margin: 1.5rem 0 0;
      font-size: clamp(1.75rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .amount-label {
      margin: 0.4rem 0 0;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meta {
      margin: 1.5rem 0 0;
      padding: 1.125rem 0 0;
      border-top: 1px solid var(--border);
      text-align: left;
    }

    .meta dl {
      margin: 0;
      display: grid;
      gap: 0.75rem;
    }

    .meta .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }

    .meta dt {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
    }

    .meta dd {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .foot {
      margin: 1.25rem 0 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="page">
    <header class="brand">
      <p class="brand-name">Landar&rsquo;s Food</p>
      <hr class="brand-rule" aria-hidden="true">
    </header>
    <main class="card">
      {% block content %}{% endblock %}
    </main>
    {% block footer %}{% endblock %}
  </div>
</body>
</html>
