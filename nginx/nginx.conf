# Rate limiting zones. $binary_remote_addr is the REAL client IP: the HTTPS server below swaps the TCP peer
# for CF-Connecting-IP, but only when the peer is a Cloudflare edge address (set_real_ip_from ranges there).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Auth zone covers login/register AND csrf/profile/refresh under /api/auth/. 10r/s + burst=40
# is enough for a human SPA burst (signup + csrf + profile + a resend) and a small CGNAT/office
# wave; bots still share one IP bucket. Per-email / stuffing limits belong in Django.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
# Root path: throttle abuse (POST to /, aggressive crawlers) while allowing normal GET/HEAD
limit_req_zone $binary_remote_addr zone=root:10m rate=15r/s;

# Secret redaction for the access log. Password-reset / e-mail-verification tokens travel in query strings
# (GET /api/auth/password-reset/validate/?token=..., /api/auth/check-verification/?token=...) and in the
# Referer of the pages that call them (/reset-password?token=..., /verify-email?token=...). Logs are persisted
# and shipped, so the VALUE of every query parameter whose name ends in "token" (any case) becomes REDACTED;
# all other parameters are kept. Each map redacts the first not-yet-redacted such parameter (so the token may
# be in any position, up to two of them); the last map is a fail-safe that blanks the whole query string if
# a third one is present. $log_uri / $log_referer are what rid_combined logs instead of $request / $http_referer.
map $request_uri $log_uri_1 {
    "~*^(?<pre>.*?[?&][a-z0-9_.-]*token=)(?!REDACTED(?:&|$))[^&]*(?<post>.*)$" "${pre}REDACTED${post}";
    default $request_uri;
}
map $log_uri_1 $log_uri_2 {
    "~*^(?<pre>.*?[?&][a-z0-9_.-]*token=)(?!REDACTED(?:&|$))[^&]*(?<post>.*)$" "${pre}REDACTED${post}";
    default $log_uri_1;
}
map $log_uri_2 $log_uri {
    "~*^(?<pre>[^?]*)\?(?:[^&]*&)*[a-z0-9_.-]*token=(?!REDACTED(?:&|$))" "${pre}?REDACTED";
    default $log_uri_2;
}
map $http_referer $log_referer_1 {
    "~*^(?<pre>.*?[?&][a-z0-9_.-]*token=)(?!REDACTED(?:&|$))[^&]*(?<post>.*)$" "${pre}REDACTED${post}";
    ""      "-";    # keep the "-" that combined prints for an absent Referer
    default $http_referer;
}
map $log_referer_1 $log_referer_2 {
    "~*^(?<pre>.*?[?&][a-z0-9_.-]*token=)(?!REDACTED(?:&|$))[^&]*(?<post>.*)$" "${pre}REDACTED${post}";
    default $log_referer_1;
}
map $log_referer_2 $log_referer {
    "~*^(?<pre>[^?]*)\?(?:[^&]*&)*[a-z0-9_.-]*token=(?!REDACTED(?:&|$))" "${pre}?REDACTED";
    default $log_referer_2;
}

# Access log: the standard "combined" fields first (so awk '{print $9}' is still the HTTP status), then
#   rid    = X-Request-ID (nginx $request_id): forwarded to Django and returned to the browser, so one id ties a
#            customer report / browser response header to this line and to the Django log lines
#   cf_ray = Cloudflare Ray ID (the same id shows up in the Cloudflare dashboard)
#   rt/urt = total request time / upstream response time in seconds ("-" when nothing was proxied)
log_format rid_combined '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
                        '$status $body_bytes_sent "$log_referer" "$http_user_agent" '
                        'rid=$request_id cf_ray=$http_cf_ray rt=$request_time urt=$upstream_response_time';

# Upstream names are variables + Docker DNS (resolver in nginx.conf.main) so
# nginx can start while frontend/backend are still coming up, and so a
# recreate does not leave nginx pointing at a stale IP until the next reload.
# (static `upstream { server hostname; }` is resolved once at start and
# `nginx -t` / boot fail with "host not found" if that container is gone.)

# Drop scanner/bot traffic with unknown Host (never proxied to Django/Next).
# access_log off: a burst of these filled Docker json logs and starved workers.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    limit_conn perip 8;
    return 444;
}

# HTTP to HTTPS redirect. Server-level `return 301` would also catch Docker
# healthchecks (wget follows to HTTPS and fails). /nginx-health is local liveness
# only — it must not proxy to Django.
server {
    listen 80;
    listen [::]:80;
    server_name landarsfood.com www.landarsfood.com localhost;
    error_log /var/log/nginx/error.log warn;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Unknown Host on HTTPS - close the connection (must load certs for the TLS handshake).
# (ssl_reject_handshake was tried and dropped: it can turn an SNI mismatch on the
# Cloudflare->origin hop into a full outage, and it is not part of the auth fix.)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/ssl/landarsfood/landarsfood.com.pem;
    ssl_certificate_key /etc/ssl/landarsfood/landarsfood.com.key.pem;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    limit_conn perip 8;
    return 444;
}

# HTTPS server configuration
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name landarsfood.com www.landarsfood.com localhost;

    limit_conn perip 40;

    set $backend_host backend:8000;
    set $frontend_host frontend-marketplace:3000;

    # SSL Configuration
    # For DEBUG=True (testing):

    # ssl_certificate /etc/ssl/landarsfood/selfsigned.crt;
    # ssl_certificate_key /etc/ssl/landarsfood/selfsigned.key;


    # For DEBUG=False (production):
    
    ssl_certificate /etc/ssl/landarsfood/landarsfood.com.pem;
    ssl_certificate_key /etc/ssl/landarsfood/landarsfood.com.key.pem;
    ssl_trusted_certificate /etc/ssl/landarsfood/cloudflare.crt;

    # ssl_client_certificate /etc/ssl/landarsfood/cloudflare.crt; #Maybe not needed
    # ssl_verify_client optional;


    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on; #maybe not
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Real client IP behind Cloudflare. Cloudflare connects to this origin from its own edge addresses and
    # passes the visitor's IP in CF-Connecting-IP. nginx honours that header ONLY when the TCP peer is one of
    # the set_real_ip_from ranges, so a request that reaches the origin directly cannot spoof its IP.
    # Without set_real_ip_from, real_ip_header is ignored: $remote_addr stays the Cloudflare edge IP and every
    # customer behind that edge shares one nginx limit_req bucket, one DRF throttle bucket and one log identity.
    # Ranges = https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 (fetched 2026-09-20).
    # Refresh periodically (see docs/SECURITY_PRODUCTION.md). Do NOT trust private ranges by default.
    # Cloudflare Tunnel (cloudflared) hop: these CF ranges are a no-op until the TCP peer nginx sees
    # is trusted. A tunnel container connects from its Docker-network address, not from Cloudflare's
    # published ranges, so CF-Connecting-IP is ignored and $remote_addr stays that hop. After you
    # confirm that address from logs, add exactly one:
    #   set_real_ip_from <cloudflared-ip-as-nginx-sees-it>;
    # Do not guess a private IP. Orange-cloud (CF edge → nginx) does not need that extra line.
    # After real_ip, proxy X-Forwarded-For is $remote_addr (not $proxy_add_x_forwarded_for) so
    # DRF NUM_PROXIES=1 keys on the customer, not a leftover client-supplied chain.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Access log with request id / Cloudflare Ray / timings (see log_format rid_combined above);
    # /var/log/nginx/access.log is a symlink to stdout in the official nginx image.
    access_log /var/log/nginx/access.log rid_combined;

    # Production security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://checkout.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: https://api.stripe.com https://checkout.stripe.com; frame-src 'self' https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;  

    # Request id: nginx generates $request_id, forwards it to Django (proxy_set_header X-Request-ID in the
    # proxied locations below) and returns it to the client exactly once - Django's echo of it is hidden.
    # Declared here, next to the security headers, on purpose: nginx inherits add_header from the server
    # level only into locations that define none of their own, so a location-level add_header (CORS lines
    # used to be one) would silently drop HSTS/CSP/etc. `always` also covers nginx-made 429/502/504 answers.
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;


    # Scanner probes with a valid Host: close here so they never hit Next.js/Django.
    # Prefix locations (not a regex map): map values "1" are compiled as $1 and nginx
    # refuses to start with "unknown 1 variable".
    location ^~ /.env { access_log off; return 444; }
    location ^~ /.git { access_log off; return 444; }
    location ^~ /.aws { access_log off; return 444; }
    location ^~ /.ssh { access_log off; return 444; }
    location ^~ /.htpasswd { access_log off; return 444; }
    location ^~ /.npmrc { access_log off; return 444; }
    location ^~ /.yarnrc { access_log off; return 444; }
    location ^~ /wp-config { access_log off; return 444; }
    location ^~ /vendor/phpunit/ { access_log off; return 444; }
    location ^~ /_ignition/ { access_log off; return 444; }
    location ^~ /cgi-bin/ { access_log off; return 444; }

    # Festival CloudPRNT: printer Basic auth must reach Django unchanged.
    location /api/festival/cloudprnt/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # CORS / preflight is answered by Django (django-cors-headers, CORS_ALLOWED_ORIGINS) - nginx must NOT add
    # Access-Control-* here: a second Access-Control-Allow-Origin makes browsers reject the response.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        
        # Timeouts (60s so product list with pagination/count doesn't 504 on cold cache or slow DB)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Error handling
        # One upstream: retrying 5xx triples load during an outage and freezes the site.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 1;
    }
    
    # Authentication endpoints with stricter rate limiting.
    # Per-IP (after Cloudflare real_ip). Burst covers a wave of humans behind one
    # office/CGNAT (register + csrf/profile/refresh + a couple of resends). Django owns
    # per-email limits; this only slows a single IP.
    location /api/auth/ {
        limit_req zone=auth burst=40 nodelay;
        # 429 (not the default 503) so the frontend can tell "slow down" from "server down".
        limit_req_status 429;
        # Rejections are still in the access log (429, redacted URI). Keep them out of error.log (default level
        # error): its "request:" field is the raw request line, i.e. ?token=... would be logged unredacted.
        limit_req_log_level info;
        # Auth / profile bodies are tiny (no uploads under /api/auth/): cap them, nginx answers 413 beyond this.
        client_max_body_size 16k;
        
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        
        # Timeouts (60s for consistency with /api/)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Error handling
        # One upstream: retrying 5xx triples load during an outage and freezes the site.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 1;
    }


    # Static files (CSS, JS, images)
    location /static/ {
        alias /backend/static/;
        autoindex on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ =404;
    }

    # Media files (user uploads)
    location /media/ {
        alias /backend/media/;
        expires 1M;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ =404;
    }
    
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django liveness (monitoring). Docker must use /nginx-health instead:
    # this location is down whenever gunicorn is down.
    location /health/ {
        proxy_pass http://$backend_host;
        access_log off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /admin/ {
        # Allow file uploads up to 10MB (images can be up to 5MB, plus overhead)
        client_max_body_size 10M;
        # Increase buffer size to reduce disk buffering for larger uploads
        # Files larger than this will be buffered to disk (which is fine)
        client_body_buffer_size 256k;
        
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        
        # Extended timeouts (PDF statement parse in admin, invoices, etc.)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Error handling
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 1;
    }
    
    # Block POST to root: invalid for our app, stops bots triggering Next.js Server Action errors
    location = / {
        limit_req zone=root burst=20 nodelay;
        # Reject non-GET/HEAD methods (POST, PUT, DELETE, etc.) with 405
        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405;
        }
        proxy_pass http://$frontend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend (Next.js) - all other requests
    location / {
        proxy_pass http://$frontend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support for Next.js dev mode
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

}